name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build site
        run: make web
      - name: Build
        run: |
          for pair in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64; do
            os=${pair%/*}
            arch=${pair#*/}
            out="hermes_${os}_${arch}"
            if [ "$os" = windows ]; then
              out="${out}.exe"
            fi
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o "$out" ./cmd/hermes
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            hermes_darwin_arm64
            hermes_darwin_amd64
            hermes_linux_amd64
            hermes_linux_arm64
            hermes_windows_amd64.exe
            scripts/install.sh
